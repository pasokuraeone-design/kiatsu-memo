<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>気圧ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@300;400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151b2e;
    --paper:#f4f2ec;
    --panel:#ffffff;
    --high:#3d6fa3;
    --low:#7c5a9e;
    --line:#c9c4b6;
    --warn:#a8493c;
    --muted:#6b6a63;
    --good:#3f7d5c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans JP', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    padding:20px 18px 60px;
  }
  .top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .top h1{
    font-size:15px;
    font-weight:500;
    letter-spacing:0.02em;
    margin:0;
    color:var(--muted);
  }
  .top .loc{
    font-size:11px;
    color:var(--muted);
  }

  .hero{
    background:var(--panel);
    border-radius:4px;
    padding:26px 22px 20px;
    border:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute; inset:0;
    opacity:0.55;
    transition:background 1.2s ease;
    pointer-events:none;
  }
  .hero-inner{position:relative; z-index:1;}
  .reading{
    display:flex;
    align-items:flex-end;
    gap:8px;
  }
  .reading .num{
    font-family:'Spectral', serif;
    font-weight:400;
    font-size:64px;
    line-height:1;
    letter-spacing:-0.01em;
  }
  .reading .unit{
    font-size:15px;
    color:var(--muted);
    padding-bottom:8px;
  }
  .trend-line{
    margin-top:6px;
    font-size:14px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .trend-arrow{font-size:16px;}
  .updated{
    margin-top:14px;
    font-size:11px;
    color:var(--muted);
  }

  .alert{
    margin-top:14px;
    padding:12px 14px;
    background:rgba(168,73,60,0.09);
    border-left:3px solid var(--warn);
    border-radius:2px;
    font-size:13px;
    line-height:1.6;
    color:#5c2a22;
    display:none;
  }
  .alert.show{display:block;}

  .section{
    margin-top:28px;
  }
  .section-title{
    font-size:13px;
    color:var(--muted);
    margin-bottom:10px;
    font-weight:500;
  }

  .chart-wrap{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 12px 10px;
  }
  svg{display:block; width:100%; height:auto;}
  .axis-label{
    font-size:9px;
    fill:var(--muted);
    font-family:'IBM Plex Sans JP', sans-serif;
  }
  .now-tag{
    font-size:10px;
    fill:var(--ink);
    font-weight:500;
  }

  .log-buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .log-btn{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px 4px 10px;
    font-family:inherit;
    font-size:11px;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
    line-height:1.4;
    transition:transform 0.15s ease, border-color 0.15s ease;
  }
  .log-btn:active{transform:scale(0.96);}
  .log-btn .dot{
    width:10px; height:10px;
    border-radius:50%;
    margin:0 auto 6px;
  }
  .log-btn[data-level="0"] .dot{background:var(--good);}
  .log-btn[data-level="1"] .dot{background:#9a9560;}
  .log-btn[data-level="2"] .dot{background:#b8763f;}
  .log-btn[data-level="3"] .dot{background:var(--warn);}

  .log-saved{
    font-size:12px;
    color:var(--good);
    margin-top:8px;
    height:14px;
    text-align:center;
  }

  .history{
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .history-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .history-row:last-child{border-bottom:none;}
  .history-row .time{color:var(--muted); width:90px; flex-shrink:0;}
  .history-row .lv{flex:1; padding-left:8px;}
  .history-row .pressure{color:var(--muted); text-align:right;}
  .history-empty{
    font-size:12px;
    color:var(--muted);
    padding:14px 4px;
    text-align:center;
  }

  .note{
    margin-top:24px;
    font-size:11px;
    color:var(--muted);
    line-height:1.7;
    padding:0 2px;
  }

  .status{
    font-size:12px;
    color:var(--muted);
    padding:30px 4px;
    text-align:center;
  }
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <h1>気圧ノート</h1>
    <div class="loc" id="locLabel">位置情報を取得中…</div>
  </div>

  <div class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-inner">
      <div class="reading">
        <span class="num" id="currentPressure">–</span>
        <span class="unit">hPa</span>
      </div>
      <div class="trend-line">
        <span class="trend-arrow" id="trendArrow"></span>
        <span id="trendText">読み込み中…</span>
      </div>
      <div class="updated" id="updatedAt"></div>
    </div>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="section">
    <div class="section-title">直近48時間の気圧</div>
    <div class="chart-wrap">
      <svg id="chartSvg" viewBox="0 0 440 180" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

  <div class="section">
    <div class="section-title">今の体調は？</div>
    <div class="log-buttons">
      <button class="log-btn" data-level="0"><div class="dot"></div>絶好調</button>
      <button class="log-btn" data-level="1"><div class="dot"></div>普通</button>
      <button class="log-btn" data-level="2"><div class="dot"></div>だるい</button>
      <button class="log-btn" data-level="3"><div class="dot"></div>しんどい</button>
    </div>
    <div class="log-saved" id="logSaved"></div>
  </div>

  <div class="section">
    <div class="section-title">記録</div>
    <div class="chart-wrap history" id="historyList">
      <div class="history-empty">まだ記録がありません</div>
    </div>
  </div>

  <div class="note">
    気圧データは Open-Meteo（気象庁などの公開データを利用した無料API）から取得しています。目安として、6時間で5〜6hPa以上の急な低下があると、頭痛や倦怠感が出やすいと言われています。
  </div>

</div>

<script>
const STORAGE_KEY = 'symptom-log-v1';
let pressureData = null; // {times:[], values:[]}
let latestFetchLat = null, latestFetchLon = null;

const levelLabels = ['絶好調','普通','だるい','しんどい'];

function fmtTime(d){
  return d.getMonth()+1 + '/' + d.getDate() + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setHeroBg(pressure){
  // map pressure roughly 990-1030 hPa -> low(purple) to high(blue)
  const bg = document.getElementById('heroBg');
  const t = Math.max(0, Math.min(1, (pressure - 990) / 40));
  const low = [124,90,158];
  const high = [61,111,163];
  const c = low.map((v,i)=> Math.round(v + (high[i]-v)*t));
  bg.style.background = `radial-gradient(circle at 85% -10%, rgba(${c[0]},${c[1]},${c[2]},0.35), transparent 60%)`;
}

async function getLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){
      resolve({lat:34.7667, lon:134.8500, fallback:true});
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({lat:pos.coords.latitude, lon:pos.coords.longitude, fallback:false}),
      () => resolve({lat:34.7667, lon:134.8500, fallback:true}),
      {timeout:8000}
    );
  });
}

async function fetchPressure(lat, lon){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=surface_pressure&past_days=2&forecast_days=1&timezone=auto`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('fetch failed');
  const data = await res.json();
  return {
    times: data.hourly.time.map(t => new Date(t)),
    values: data.hourly.surface_pressure
  };
}

function currentIndex(times){
  const now = new Date();
  let idx = 0;
  for(let i=0;i<times.length;i++){
    if(times[i] <= now) idx = i;
  }
  return idx;
}

function renderHero(){
  const idx = currentIndex(pressureData.times);
  const cur = pressureData.values[idx];
  document.getElementById('currentPressure').textContent = cur.toFixed(1);
  setHeroBg(cur);

  // trend over past 6h
  const sixHoursAgoIdx = Math.max(0, idx - 6);
  const past = pressureData.values[sixHoursAgoIdx];
  const delta = cur - past;

  const arrow = document.getElementById('trendArrow');
  const text = document.getElementById('trendText');
  if(delta <= -1.5){
    arrow.textContent = '↓';
    text.textContent = `6時間で ${Math.abs(delta).toFixed(1)} hPa 下降中`;
  } else if(delta >= 1.5){
    arrow.textContent = '↑';
    text.textContent = `6時間で ${delta.toFixed(1)} hPa 上昇中`;
  } else {
    arrow.textContent = '→';
    text.textContent = '安定しています';
  }

  document.getElementById('updatedAt').textContent = '更新: ' + fmtTime(new Date());

  // alert if sharp drop
  const alertBox = document.getElementById('alertBox');
  if(delta <= -5){
    alertBox.classList.add('show');
    alertBox.textContent = `急な気圧の低下（6時間で${Math.abs(delta).toFixed(1)}hPa）を検知しました。頭痛や倦怠感が出やすいタイミングかもしれません。`;
  } else {
    alertBox.classList.remove('show');
  }
}

function renderChart(){
  const svg = document.getElementById('chartSvg');
  const W = 440, H = 180;
  const padL = 40, padR = 10, padT = 14, padB = 20;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const vals = pressureData.values;
  const times = pressureData.times;
  const minV = Math.min(...vals) - 1;
  const maxV = Math.max(...vals) + 1;
  const n = vals.length;

  const xFor = i => padL + (i/(n-1)) * plotW;
  const yFor = v => padT + (1 - (v - minV)/(maxV - minV)) * plotH;

  let path = '';
  vals.forEach((v,i)=>{
    const x = xFor(i), y = yFor(v);
    path += (i===0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  });

  const areaPath = path + `L${xFor(n-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${xFor(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  const idx = currentIndex(times);
  const nowX = xFor(idx), nowY = yFor(vals[idx]);

  // gridlines for pressure
  const gridVals = [];
  const step = 5;
  let g = Math.ceil(minV/step)*step;
  while(g <= maxV){ gridVals.push(g); g += step; }

  let gridHtml = gridVals.map(v => {
    const y = yFor(v);
    return `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#dcd8ca" stroke-width="1"/>
      <text x="${padL-6}" y="${y+3}" text-anchor="end" class="axis-label">${v}</text>`;
  }).join('');

  // day/night markers - label every 12h
  let xLabels = '';
  for(let i=0;i<n;i+=12){
    const x = xFor(i);
    xLabels += `<text x="${x}" y="${H-4}" text-anchor="middle" class="axis-label">${times[i].getMonth()+1}/${times[i].getDate()}</text>`;
  }

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3d6fa3" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#3d6fa3" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridHtml}
    <path d="${areaPath}" fill="url(#areaGrad)"/>
    <path d="${path}" fill="none" stroke="#3d6fa3" stroke-width="2"/>
    <line x1="${nowX}" y1="${padT}" x2="${nowX}" y2="${padT+plotH}" stroke="#a8493c" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="${nowX}" cy="${nowY}" r="3.5" fill="#a8493c"/>
    <text x="${nowX}" y="${padT-4}" text-anchor="middle" class="now-tag">今</text>
    ${xLabels}
  `;
}

async function loadPressure(){
  const loc = await getLocation();
  document.getElementById('locLabel').textContent = loc.fallback ? '位置情報なし（既定の地点）' : '現在地';
  try{
    pressureData = await fetchPressure(loc.lat, loc.lon);
    renderHero();
    renderChart();
  } catch(e){
    document.getElementById('trendText').textContent = 'データを取得できませんでした（' + (e && e.message ? e.message : '通信エラー') + '）';
  }
}

// --- symptom log ---
// Uses window.storage when running inside a Claude artifact (syncs across devices there),
// and falls back to plain localStorage when hosted elsewhere (e.g. GitHub Pages).
const hasClaudeStorage = typeof window.storage !== 'undefined';

async function loadHistory(){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get(STORAGE_KEY);
      return res ? JSON.parse(res.value) : [];
    }
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){
    return [];
  }
}

async function saveHistory(list){
  try{
    if(hasClaudeStorage){
      await window.storage.set(STORAGE_KEY, JSON.stringify(list));
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }
  } catch(e){ /* ignore */ }
}

function renderHistory(list){
  const wrap = document.getElementById('historyList');
  if(!list.length){
    wrap.innerHTML = '<div class="history-empty">まだ記録がありません</div>';
    return;
  }
  wrap.innerHTML = list.slice().reverse().slice(0,20).map(item => {
    const d = new Date(item.t);
    return `<div class="history-row">
      <div class="time">${fmtTime(d)}</div>
      <div class="lv">${levelLabels[item.level]}</div>
      <div class="pressure">${item.pressure != null ? item.pressure.toFixed(1)+' hPa' : '–'}</div>
    </div>`;
  }).join('');
}

async function logSymptom(level){
  let pressureNow = null;
  if(pressureData){
    const idx = currentIndex(pressureData.times);
    pressureNow = pressureData.values[idx];
  }
  const list = await loadHistory();
  list.push({t: Date.now(), level, pressure: pressureNow});
  await saveHistory(list);
  renderHistory(list);
  const saved = document.getElementById('logSaved');
  saved.textContent = '記録しました';
  setTimeout(()=>{ saved.textContent=''; }, 1800);
}

document.querySelectorAll('.log-btn').forEach(btn => {
  btn.addEventListener('click', () => logSymptom(parseInt(btn.dataset.level, 10)));
});

(async function init(){
  const list = await loadHistory();
  renderHistory(list);
  await loadPressure();
})();
</script>
</body>
</html>
